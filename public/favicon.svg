<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- warm paper tile background -->
  <rect width="128" height="128" rx="28" fill="#e8e4e0"/>
  <rect x="0.5" y="0.5" width="127" height="127" rx="27.5" stroke="#000000" stroke-opacity="0.06"/>

  <!-- subtle sketch grid / street lines -->
  <g stroke="#a8a29e" stroke-opacity="0.32" stroke-width="2" stroke-linecap="round">
    <path d="M24 44 L104 44"/>
    <path d="M20 72 L108 72"/>
    <path d="M42 24 L42 104"/>
    <path d="M84 20 L84 108"/>
  </g>

  <defs>
    <!-- clip so the pencil stays inside the pin head -->
    <clipPath id="pinHead">
      <circle cx="64" cy="49.3" r="27"/>
    </clipPath>
  </defs>

  <!-- teardrop map pin -->
  <path d="M64 22
           C48.5 22 36 34.2 36 49.3
           C36 62 51 82 61 99.5
           C62.4 101.9 65.6 101.9 67 99.5
           C77 82 92 62 92 49.3
           C92 34.2 79.5 22 64 22 Z"
        fill="#7c3aed"/>

  <!-- pencil, clipped inside the pin head, tilted like it's drawing -->
  <g clip-path="url(#pinHead)">
    <g transform="rotate(-40 64 49.3)">
      <!-- eraser cap -->
      <rect x="55.5" y="24" width="17" height="6.5" rx="3" fill="#f97316"/>
      <!-- pencil body -->
      <rect x="55.5" y="30" width="17" height="24" fill="#facc15"/>
      <!-- metal band -->
      <rect x="55.5" y="50.5" width="17" height="3.5" fill="#e8e4e0" fill-opacity="0.9"/>
      <!-- sharpened wood tip -->
      <path d="M55.5 54 L64 68 L72.5 54 Z" fill="#f5deb3"/>
      <!-- graphite point -->
      <path d="M60.6 60.4 L64 68 L67.4 60.4 Z" fill="#3f3f46"/>
    </g>
  </g>

  <!-- inner sketch highlight arc on pin -->
  <path d="M64 22 C48.5 22 36 34.2 36 49.3 C36 55 39 62.5 43.5 71"
        stroke="#ffffff" stroke-opacity="0.30" stroke-width="3.5" stroke-linecap="round" fill="none"/>
</svg>
