<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- clip so the pencil stays inside the pin head -->
    <clipPath id="pinHead">
      <circle cx="64" cy="55" r="27"/>
    </clipPath>
    <!-- soft ground shadow -->
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- warm paper background (full-bleed; iOS masks its own corners) -->
  <rect width="128" height="128" rx="28" fill="#e8e4e0"/>
  <rect x="0.5" y="0.5" width="127" height="127" rx="27.5" stroke="#000000" stroke-opacity="0.06"/>

  <!-- soft shadow beneath the pin -->
  <ellipse cx="64" cy="108" rx="20" ry="6" fill="url(#shadow)"/>

  <!-- teardrop map pin, centered -->
  <path d="M64 27.5
           C48.5 27.5 36 39.7 36 54.8
           C36 67.5 51 87.5 61 105
           C62.4 107.4 65.6 107.4 67 105
           C77 87.5 92 67.5 92 54.8
           C92 39.7 79.5 27.5 64 27.5 Z"
        fill="#7c3aed"/>

  <!-- pencil, clipped inside the pin head, tilted like it's drawing -->
  <g clip-path="url(#pinHead)">
    <g transform="rotate(-40 64 55)">
      <!-- eraser cap -->
      <rect x="55.5" y="29.5" width="17" height="6.5" rx="3" fill="#f97316"/>
      <!-- pencil body -->
      <rect x="55.5" y="35.5" width="17" height="24" fill="#facc15"/>
      <!-- metal band -->
      <rect x="55.5" y="56" width="17" height="3.5" fill="#e8e4e0" fill-opacity="0.9"/>
      <!-- sharpened wood tip -->
      <path d="M55.5 59.5 L64 73.5 L72.5 59.5 Z" fill="#f5deb3"/>
      <!-- graphite point -->
      <path d="M60.6 65.9 L64 73.5 L67.4 65.9 Z" fill="#3f3f46"/>
    </g>
  </g>

  <!-- inner sketch highlight arc on pin -->
  <path d="M64 27.5 C48.5 27.5 36 39.7 36 54.8 C36 60.5 39 68 43.5 76.5"
        stroke="#ffffff" stroke-opacity="0.28" stroke-width="3.5" stroke-linecap="round" fill="none"/>
</svg>
